name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: false
        default: "latest"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore FileSearch.csproj

      - name: Publish
        run: dotnet publish FileSearch.csproj -c Release -o publish

      - name: Create ZIP
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          Compress-Archive -Path publish\* -DestinationPath "FileSearch-$version.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: FileSearch ${{ inputs.version }}
          files: FileSearch-${{ inputs.version }}.zip
          generate_release_notes: true
